name: Build جعبه ابزار مهندس V532 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index532.html'
      - '.github/workflows/build-apk532.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > geomatic-pro-upload.jks
          test -s geomatic-pro-upload.jks

      - name: Create Android project from proven MiladGeo Android recipe
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          mkdir -p app/src/main/java/com/miladgeo/engineerstool
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp index532.html app/src/main/assets/index.html

          # V532 — use the new supplied MiladGeobot icon directly.
          cat > /tmp/miladgeo_icon_532.b64 <<'EOF_ICON'
