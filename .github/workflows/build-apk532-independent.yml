          test -s /tmp/build-apk380.yml

          python3 - <<'PYX'
          from pathlib import Path
          import re

          s = Path('/tmp/build-apk380.yml').read_text()
          m = re.search(
              r"cat > app/src/main/java/com/miladgeo/engineerstool/MainActivity\.java <<'EOF_JAVA'\n(.*?)\n          EOF_JAVA",
              s,
              re.S
          )
          if not m:
              raise SystemExit('MainActivity recipe not found in proven Android build recipe')

          Path('app/src/main/java/com/miladgeo/engineerstool/MainActivity.java').write_text(m.group(1) + '\n')
          PYX

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EngineersToolboxV532"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          android.suppressUnsupportedCompileSdk=36
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.miladgeo.engineerstool'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.miladgeo.engineerstool'
                  minSdk 23
                  targetSdk 36
                  versionCode 532
                  versionName '532.0'
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file("geomatic-pro-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "geometric-upload"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="جعبه ابزار مهندس"
                  android:icon="@drawable/miladgeo_icon"
                  android:roundIcon="@drawable/miladgeo_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

      - name: Verify generated project
        run: |
          set -e
          test -s index532.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/miladgeo/engineerstool/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/miladgeo_icon.jpg
          test -s geomatic-pro-upload.jks
          cmp -s index532.html app/src/main/assets/index.html
          grep -q 'class MainActivity' app/src/main/java/com/miladgeo/engineerstool/MainActivity.java
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'versionCode 532' app/build.gradle

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease bundleRelease --stacktrace

      - name: Verify APK and AAB
        run: |
          set -e
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngineersToolbox-V532-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: EngineersToolbox-V532-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
