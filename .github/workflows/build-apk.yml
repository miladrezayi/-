name: Build MiladGeo Walkie APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android project files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Top-level files:"
          ls -la
          echo "App files:"
          ls -la app || true
          test -f settings.gradle.kts || (echo "ERROR: settings.gradle.kts must be in repository root" && exit 1)
          test -f app/build.gradle.kts || (echo "ERROR: app/build.gradle.kts must be at app/build.gradle.kts" && exit 1)
          grep -q 'include(":app")' settings.gradle.kts || (echo 'ERROR: settings.gradle.kts must contain include(":app")' && exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Show Gradle projects
        run: gradle --no-daemon projects

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miladgeo-walkie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
