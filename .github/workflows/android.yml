name: Build Siren Radio APK

on:
  push:
    branches: [ main, master, siren-radio-upload ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
      - 'SOUNDS_SOURCES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download licensed offline sound library
        run: bash .github/scripts/download_siren_sounds.sh
      - name: Commit downloaded offline sound assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/*.mp3
          if git diff --cached --quiet; then
            echo "No sound asset updates."
          else
            git commit -m "Add CC0 offline radio and siren audio assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Package sound library
        run: zip -j SirenRadio-sound-assets.zip app/src/main/res/raw/*.mp3
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SirenRadio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload sound library
        uses: actions/upload-artifact@v4
        with:
          name: SirenRadio-sound-assets
          path: SirenRadio-sound-assets.zip
          if-no-files-found: error
