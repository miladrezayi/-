name: Build Siren Radio APK

on:
  push:
    branches: [ main, master, siren-radio-upload ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
      - 'SOUNDS_SOURCES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download licensed offline sound library
        run: bash .github/scripts/download_siren_sounds.sh
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SirenRadio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
