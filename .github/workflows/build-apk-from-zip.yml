name: Build MiladGeo Walkie APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiladGeoWalkie_READY.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="MiladGeoWalkie_READY.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Upload MiladGeoWalkie_READY.zip to the repository root."
            exit 1
          fi
          mkdir -p _project_unpack
          unzip -oq "$ZIP_FILE" -d _project_unpack
          SRC="_project_unpack/MiladGeoWalkie_READY"
          test -f "$SRC/settings.gradle.kts"
          test -f "$SRC/build.gradle.kts"
          test -f "$SRC/app/build.gradle.kts"
          test -f "$SRC/app/src/main/AndroidManifest.xml"
          rm -rf app
          cp -f "$SRC/settings.gradle.kts" .
          cp -f "$SRC/build.gradle.kts" .
          cp -f "$SRC/gradle.properties" .
          cp -a "$SRC/app" ./app
          echo "Project structure prepared:"
          find app -maxdepth 6 -type f | sort
          grep -q 'include(":app")' settings.gradle.kts || grep -q "include(\":app\")" settings.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiladGeoWalkie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
